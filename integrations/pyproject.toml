[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trl-cgrpo"
version = "0.2.0"
description = "C-GRPO: conformal adaptive rollout budgets for GRPO, as a TRL GRPOTrainer subclass"
readme = "trl_cgrpo/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arya Fayyazi" }]
keywords = ["reinforcement-learning", "grpo", "rlhf", "trl", "conformal-prediction", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["trl>=1.12,<1.15", "datasets", "numpy>=1.24", "torch"]

[project.optional-dependencies]
vllm = ["trl[vllm]>=1.12,<1.15"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/AryaFayyazi/CGRPO"
Repository = "https://github.com/AryaFayyazi/CGRPO"
Paper = "https://openreview.net/forum?id=TrdqzzvFCs"
Issues = "https://github.com/AryaFayyazi/CGRPO/issues"

[tool.setuptools.packages.find]
include = ["trl_cgrpo"]
exclude = ["trl_cgrpo.tests*"]
